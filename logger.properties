# Logger settings for the Mangla API (packages/common_logger; app.properties points here).
# Format: key=value, one per line. Comments go on their own line.

# Master switch. false = no log files (the console still gets every line).
logging_enabled=true

# Folder for log files, relative to this file: mangla_backend/logs (git-ignored).
log_directory=logs

# Log files are named <prefix>_YYYY-MM-DD_HH-MM-SS_ffffff.log
log_file_prefix=mangla_api

# Max size of one log file in MB before a new file is started.
max_file_size_mb=10

# Minimum level written: DEBUG, INFO, WARNING, ERROR or CRITICAL. Also the root logger level.
log_level=INFO

# Mask PII in log lines. Passwords, key=value secrets and URL passwords (DATABASE_URL) are masked
# either way (packages/common_logger/log_masker.py).
mask_sensitive_data=true

# Parts of each log line (true / false). The message itself is always written, inside [ ].
include_timestamp=true
include_process_id=true
include_thread_id=true
include_level=true
include_elapsed=true
# The request ID (uuid) of the request that wrote the line; '-' outside a request.
include_request_id=true
include_source=true
