# Mangla backend settings. Format: key=value, one per line; lines starting with # or ! are comments.
# Secrets (DATABASE_URL, keys) stay in .env, never here.
# An environment variable MANGLA_<KEY> overrides any key below, upper-cased with '.' as '_'
# (audit.background -> MANGLA_AUDIT_BACKGROUND); Azure app settings use these.

# --- Application ---
app.name=Mangla Backend
app.version=0.1.0

# Common prefix in front of every endpoint: /app/orders/user-all, /app/home/..., ...
api.prefix=/app

# --- Server (python -m app) ---
server.host=0.0.0.0
server.port=8000
server.reload=false

# Comma-separated origins allowed by CORS; * allows any.
cors.allow_origins=*

# --- Request tracking ---
# Response header that carries the request ID (a uuid generated when each request arrives).
request_id.header=X-Request-ID

# --- Logging ---
# logger.properties for packages/common_logger (relative paths resolve from this file's folder).
logger.properties=logger.properties

# --- Auditing (orders_audit, review_audit, home_audit, posts_audit in Supabase; step names in packages/audit/audit.json) ---
# false = no audit rows are written (log lines still are).
audit.enabled=true
# true = audit rows are written by one background thread, in order, so requests don't wait for the
# Supabase round trips; false = written inline before the response.
audit.background=true
# Most audit rows waiting for the background thread; beyond this, rows are dropped with a warning.
audit.max_pending=10000
# At shutdown, wait at most this long for waiting audit rows to be written.
audit.flush_timeout_seconds=10

# --- Storage (photos and videos in Supabase Storage; buckets.md, packages/storage) ---
# How long the signed image URLs in responses stay valid, in seconds.
storage.signed_url_seconds=3600

# --- Reviews ---
# /orders/review accepts only orders whose order_status is one of these (comma-separated, any
# case). Empty = no order can be reviewed.
review.allowed_order_statuses=delivered,completed
