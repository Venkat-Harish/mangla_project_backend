# common_logger settings. Format: key=value, one per line. Comments go on their own line.
# Backslashes in paths are taken literally (C:\logs works as-is).

# Master switch. false = no folder, no files, nothing written. Other root handlers (e.g. the console)
# are still masked, following mask_sensitive_data below.
logging_enabled=true

# Folder for log files. Relative paths resolve from this file's folder.
# Environment variables are expanded: $VAR or ${VAR} everywhere, %VAR% on Windows only.
log_directory=logs

# Log files are named <prefix>_YYYY-MM-DD_HH-MM-SS_ffffff.log
log_file_prefix=app

# Max size of one log file in MB before a new file is started. Decimals allowed (0.001 = ~1 KB).
max_file_size_mb=10

# Minimum level written. One of DEBUG, INFO, WARNING, ERROR, CRITICAL.
# INFO writes INFO, WARNING, ERROR and CRITICAL; DEBUG writes everything.
# This also becomes the root logger level, so it applies to any other handlers (e.g. a console) too.
log_level=INFO

# Mask PII (ER numbers: ER000000 -> ER****00) in log lines, the console, error messages and saved pages.
# false shows them in full, for debugging. Passwords, security answers, URL session tokens,
# key=value secrets (PWD=, Password=, AccountKey=, SharedAccessSignature=, sig=, ClientSecret=) and
# URL passwords (postgresql://user:***@host, e.g. DATABASE_URL) are masked either way. The rules live in packages/common_logger/log_masker.py (class LogMasker).
mask_sensitive_data=true

# Parts of each log line (true / false). The message itself is always written, inside [ ].
include_timestamp=true
include_process_id=true
include_thread_id=true
include_level=true
# Seconds since this process's previous line, or the caller's own extra={"runtime": seconds}.
# Written just before the source as 4 digits and a dot, extra decimals cut: 0.004, 23.54, 123.4.
include_elapsed=true
include_source=true
