# Logger settings on Azure Functions, chosen with the app setting
# MANGLA_LOGGER_PROPERTIES=logger.cloud.properties (app.properties' logger.properties key).
# The deployed app folder is read-only, so no log files: every line still goes to the console
# handler and the Functions host, which send it to Application Insights, masked.

logging_enabled=false

# Mask PII in log lines (packages/common_logger/log_masker.py).
mask_sensitive_data=true
